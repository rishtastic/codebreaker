name: Deploy Codebreaker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebreaker-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/codebreaker ./cmd/codebreaker

      - name: Check production configuration
        run: sudo test -r /etc/codebreaker.env

      - name: Deploy and restart
        run: |
          sudo install -d -o codex-deploy -g codex-deploy -m 0755 /srv/codebreaker/bin
          sudo install -o codex-deploy -g codex-deploy -m 0755 build/codebreaker /srv/codebreaker/bin/codebreaker
          sudo install -o root -g root -m 0644 deploy/codebreaker.service /etc/systemd/system/codebreaker.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now codebreaker.service
          sudo systemctl restart codebreaker.service
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8081/healthz
